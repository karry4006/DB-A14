<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>管理員登入 - 現代化靈骨塔管理系統</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .auth-container {
            max-width: 400px;
            margin: 4rem auto;
            background: #fff;
            padding: 2rem;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            border-top: 5px solid var(--secondary-color);
        }
        .form-group { margin-bottom: 1.5rem; }
        .form-group label { display: block; margin-bottom: 0.5rem; font-weight: bold;}
        .form-group input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
        }
        .auth-btn {
            width: 100%;
            padding: 12px;
            background: var(--secondary-color);
            color: white;
            border: none;
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
        }
        .auth-btn:hover {
            opacity: 0.9;
        }
    </style>
</head>
<body>
    <header>
        <nav>
            <div class="logo">園區靈骨塔管理系統</div>
            <ul>
                <li><a href="index.html">返回首頁</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="auth-container">
            <h2 style="text-align: center; margin-bottom: 1.5rem; color: var(--secondary-color);">管理員系統登入</h2>
            <form id="adminLoginForm">
                <div class="form-group">
                    <label>管理員帳號</label>
                    <input type="text" id="adminAccount" placeholder="請輸入管理員帳號" required>
                </div>
                <div class="form-group">
                    <label>密碼</label>
                    <input type="password" id="adminPassword" placeholder="請輸入密碼" required>
                </div>
                <button type="submit" class="auth-btn">登入後台</button>
            </form>
        </section>
    </main>

    <script src="js/admin.js"></script>
</body>
</html>
