<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>會員登入/註冊 - 現代化靈骨塔管理系統</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .auth-container {
            max-width: 400px;
            margin: 2rem auto;
            background: #fff;
            padding: 2rem;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        .auth-tabs {
            display: flex;
            margin-bottom: 2rem;
            border-bottom: 2px solid #eee;
        }
        .auth-tab {
            flex: 1;
            text-align: center;
            padding: 10px;
            cursor: pointer;
            font-weight: bold;
            color: var(--secondary-color);
        }
        .auth-tab.active {
            color: var(--primary-color);
            border-bottom: 2px solid var(--primary-color);
        }
        .form-group { margin-bottom: 1.5rem; }
        .form-group label { display: block; margin-bottom: 0.5rem; font-weight: bold; }
        .form-group input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
            box-sizing: border-box;
        }
        .auth-btn {
            width: 100%;
            padding: 12px;
            background: var(--secondary-color);
            color: white;
            border: none;
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
        }
        .auth-btn:hover {
            background: var(--primary-color);
        }
    </style>
</head>
<body>

    <header>
        <nav>
            <div class="logo">園區靈骨塔管理系統</div>
            <ul>
                <li><a href="index.html">首頁</a></li>
                <li><a href="slots.html">塔位查詢</a></li>
                <li><a href="auth.html">會員登入</a></li>
                <li><a href="announcements.html">園區公告</a></li>
            </ul>
        </nav>
    </header>

    <div class="page-wrapper">
        <aside class="main-sidebar">
            <h3>快速功能</h3>
            <ul class="sidebar-nav">
                <li><a href="slots.html">查詢空位 (訪客)</a></li>
                <li><a href="auth.html">會員中心</a></li>
                <li><a href="auth.html">數位參拜</a></li>
                <li><a href="announcements.html">園區公告</a></li>
            </ul>
        </aside>

        <main class="content-area">
            <section class="auth-container">
                <div class="auth-tabs">
                    <div class="auth-tab active" id="tabLogin" onclick="switchTab('login')">會員登入</div>
                    <div class="auth-tab" id="tabRegister" onclick="switchTab('register')">申請註冊</div>
                </div>

                <form id="publicLoginForm">
                    <div class="form-group">
                        <label for="loginAccount">帳號 (Account)</label>
                        <input type="text" id="loginAccount" placeholder="請輸入身分證字號或帳號" required>
                    </div>
                    <div class="form-group">
                        <label for="loginPassword">密碼 (Password)</label>
                        <input type="password" id="loginPassword" placeholder="請輸入密碼" required>
                    </div>
                    <button type="submit" class="auth-btn">安全登入</button>
                </form>

                <form id="publicRegisterForm" style="display: none;">
                    <div class="form-group">
                        <label for="regAccount">設定帳號</label>
                        <input type="text" id="regAccount" required>
                    </div>
                    <div class="form-group">
                        <label for="regPassword">設定密碼</label>
                        <input type="password" id="regPassword" required>
                    </div>
                    <div class="form-group">
                        <label for="regName">真實姓名</label>
                        <input type="text" id="regName" required>
                    </div>
                    <div class="form-group">
                        <label for="regIdNumber">身分證字號</label>
                        <input type="text" id="regIdNumber" required>
                    </div>
                    <button type="submit" class="auth-btn">註冊會員</button>
                </form>
            </section>
        </main>
    </div>

    <script src="js/main.js"></script>
    <script>
        function switchTab(tab) {
            document.getElementById('tabLogin').classList.remove('active');
            document.getElementById('tabRegister').classList.remove('active');
            document.getElementById('publicLoginForm').style.display = 'none';
            document.getElementById('publicRegisterForm').style.display = 'none';

            if (tab === 'login') {
                document.getElementById('tabLogin').classList.add('active');
                document.getElementById('publicLoginForm').style.display = 'block';
            } else {
                document.getElementById('tabRegister').classList.add('active');
                document.getElementById('publicRegisterForm').style.display = 'block';
            }
        }
    </script>
</body>
</html>
