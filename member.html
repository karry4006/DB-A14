<!DOCTYPE html>
<html lang="zh-Hant">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>會員後台 - 現代化靈骨塔管理系統</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header>
        <nav>
            <div class="logo">園區靈骨塔管理系統</div>
            <ul>
                <li><a href="index.html">首頁</a></li>
                <li><a href="slots.html">塔位查詢</a></li>
                <li><a href="announcements.html">園區公告</a></li>
                <li><a href="auth.html">登出</a></li>
            </ul>
        </nav>
    </header>

    <main class="dashboard-container">
        <aside class="sidebar">
            <h3 style="margin-bottom: 1rem;">歡迎，<span id="currentMemberName">會員</span></h3>
            <ul id="memberNav">
                <li class="active" data-target="memberSlotsSection">名下塔位與親友</li>
                <li data-target="reserveSection">預約實體祭拜</li>
                <li data-target="messageSection">線上追思留言</li>
                <li data-target="memberBillsSection">管理費帳單</li>
            </ul>
        </aside>

        <section class="content-card">
            <div id="memberSlotsSection" class="content-section">
                <h2>名下登記塔位</h2>
                <table class="data-list">
                    <thead>
                        <tr>
                            <th>塔位編號</th>
                            <th>位置描述</th>
                            <th>進駐先人姓名</th>
                        </tr>
                    </thead>
                    <tbody id="memberSlotsBody">
                    </tbody>
                </table>
            </div>

            <div id="reserveSection" class="content-section" style="display: none;">
                <h2>預約實體祭拜排程</h2>
                <form id="reserveForm"
                    style="margin-top: 1rem; display: flex; flex-direction: column; gap: 15px; max-width: 500px;">
                    <div>
                        <label style="display: block; margin-bottom: 5px;">選擇名下塔位編號：</label>
                        <input type="number" id="reserveSlotId" placeholder="例如: 101" required
                            style="width: 100%; padding: 8px;">
                    </div>
                    <div>
                        <label style="display: block; margin-bottom: 5px;">預約祭拜日期：</label>
                        <input type="date" id="reserveDate" required style="width: 100%; padding: 8px;">
                    </div>
                    <div>
                        <label style="display: block; margin-bottom: 5px;">預約時段：</label>
                        <select id="reserveTime" required style="width: 100%; padding: 8px;">
                            <option value="09:00:00">09:00 - 11:00</option>
                            <option value="11:00:00">11:00 - 13:00</option>
                            <option value="14:00:00">14:00 - 16:00</option>
                        </select>
                    </div>
                    <div>
                        <label style="display: block; margin-bottom: 5px;">預計隨行人數：</label>
                        <input type="number" id="reservePeople" min="1" value="1" required
                            style="width: 100%; padding: 8px;">
                    </div>
                    <button type="submit" class="btn btn-primary"
                        style="width: fit-content; margin-top: 10px;">提交排程預約</button>
                </form>
            </div>

            <div id="messageSection" class="content-section" style="display: none;">
                <h2>線上數位追思與留言</h2>
                <form id="messageForm"
                    style="margin-top: 1rem; display: flex; flex-direction: column; gap: 15px; max-width: 500px;">
                    <div>
                        <label style="display: block; margin-bottom: 5px;">追思對象 (已故親友)：</label>
                        <select id="msgDeceasedId" required style="width: 100%; padding: 8px;">
                            <option value="">載入親友資料中...</option>
                        </select>
                    </div>
                    <div>
                        <label style="display: block; margin-bottom: 5px;">虛擬祭品：</label>
                        <select id="msgItem" required style="width: 100%; padding: 8px;">
                            <option value="鮮花">鮮花</option>
                            <option value="蠟燭">蠟燭</option>
                            <option value="水果">水果</option>
                            <option value="無">無</option>
                        </select>
                    </div>
                    <div>
                        <label style="display: block; margin-bottom: 5px;">留言內容：</label>
                        <textarea id="msgContent" rows="4" placeholder="請輸入您對先人的思念寄語..." required
                            style="width: 100%; padding: 8px; resize: vertical;"></textarea>
                    </div>
                    <button type="submit" class="btn btn-primary"
                        style="width: fit-content; margin-top: 10px;">送出追思</button>
                </form>

                <!-- 新增：動態追思牆 / 留言板 -->
                <div class="memorial-wall-container">
                    <h3 class="memorial-wall-title">近期追思紀錄</h3>
                    <div id="memorialBoard" class="memorial-board">
                        <!-- 動態留言將在此處生成 -->
                        <p style="color: #999; text-align: center; padding: 2rem;">目前尚無公開追思紀錄，您送出的思念將會顯示於此。</p>
                    </div>
                </div>
            </div>

            <div id="memberBillsSection" class="content-section" style="display: none;">

                <h2>管理費應繳帳單總額</h2>

                <div class="search-bar" style="margin-top: 1rem; margin-bottom: 1rem; display: flex; gap: 10px; align-items: center;">
                    <label for="billYearInput">年份搜尋：</label>
                    <input type="number" id="billYearInput" placeholder="輸入年份 (例如: 2026)" style="padding: 8px; border: 1px solid #ddd; border-radius: 5px;">
                    <button id="searchBillBtn" class="btn btn-primary" style="padding: 8px 20px; margin: 0;">搜尋</button>
                </div>

                <table class="data-list">
                    <thead>
                        <tr>
                            <th>費用年度</th>
                            <th>應繳金額</th>
                            <th>繳費截止日期</th>
                            <th>繳費狀態</th>
                        </tr>
                    </thead>
                    <tbody id="memberBillsBody">
                    </tbody>
                </table>
            </div>
        </section>
    </main>

    <!-- 祭拜完成動畫遮罩 -->
    <div id="worshipOverlay" class="worship-overlay">
        <div class="worship-animation-icon">✨</div>
        <h2>心意已達．福澤長存</h2>
        <p>您的追思留言與祭品已成功傳達至先人席位</p>
        <button class="btn btn-primary" style="margin-top: 2rem;" onclick="document.getElementById('worshipOverlay').classList.remove('active')">確認</button>
    </div>

    <script src="js/main.js"></script>
</body>

</html>
